# Runs the production container (the same Dockerfile Railway builds) on your
# machine with its own database, so a deploy problem can be reproduced locally.
#
#   docker compose -f docker-compose.local.yml up --build     # http://localhost:8080
#   docker compose -f docker-compose.local.yml exec app php api/database/migrate_data.php   # seed accounts
#   docker compose -f docker-compose.local.yml down -v        # stop and delete the local data
#
# Everything here is throwaway local data. None of these values are used anywhere else.
name: dorm-mart-local

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: local-only-root
      MARIADB_DATABASE: dorm_mart_local
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # The app shares this service's network (see below), so its port is published here.
      - "8080:8080"

  app:
    build:
      context: .
      args:
        # Same-origin API, as on Railway.
        REACT_APP_API_BASE: /api
    # Share the database's network so the app reaches it at 127.0.0.1. The
    # fixture loader (migrate_data.php) only runs against a local address.
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: 127.0.0.1
      DB_NAME: dorm_mart_local
      DB_USERNAME: root
      DB_PASSWORD: local-only-root
      FRONTEND_BASE_URL: http://localhost:8080
      API_BASE_URL: http://localhost:8080/api
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      DATA_UPLOADS_DIR: /data/uploads
      PROMO_UNSUBSCRIBE_SECRET: local-only-unsubscribe-secret-not-for-production
      PAYMENTS_ENABLED: "false"
      PAYMENTS_DEMO_MODE: "true"
    volumes:
      - uploads:/data/uploads
    # Railway runs schema sync as its pre-deploy step; do the same before starting.
    command: ["sh", "-c", "php api/database/migrate_schema.php && exec dorm-mart-start"]

volumes:
  db-data:
  uploads:
