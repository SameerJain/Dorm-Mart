; Production PHP settings for the Apache container.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; Largest single upload is a 25 MB video; a listing request can carry several
; photos plus a video. Apache's LimitRequestBody matches post_max_size.
upload_max_filesize = 26M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Session cookie flags are also set in auth_handle.php; these are defaults.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax

allow_url_include = Off
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
