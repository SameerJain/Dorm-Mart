# Server hardening. Response security headers (CSP, HSTS, X-Frame-Options,
# nosniff, Referrer-Policy) are set by router.php and the API bootstrap.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# Slow-client and oversized-request protection that `php -S` lacked.
Timeout 60
KeepAliveTimeout 5
LimitRequestFieldSize 16384
LimitRequestFields 100
# Largest legitimate request: several listing photos plus a 25 MB video.
LimitRequestBody 67108864

# Only these methods reach PHP; OPTIONS stays for CORS preflight.
<Location "/">
    <LimitExcept GET POST HEAD OPTIONS>
        Require all denied
    </LimitExcept>
</Location>

# Never serve dotfiles (.env*, .git) even if one ends up in the image.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<IfModule mpm_prefork_module>
    StartServers            4
    MinSpareServers         4
    MaxSpareServers         10
    MaxRequestWorkers       40
    MaxConnectionsPerChild  1000
</IfModule>
