# Every request goes to router.php, exactly as under `php -S ... router.php`.
# router.php serves the React build, routes /api/*, blocks library directories
# and raw /media, and sets the security headers.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^ /router.php [END,QSA]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b %D"
</VirtualHost>
